name: Deploy Smart contract to devnet and push image to DH

on:
  pull_request:
    types: 
      - labeled
    

jobs:
  deploy:
    if: ${{ github.event.label.name == 'CI:DEPLOY' }}
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          ref: feature/hardhat
        
      - name: Test paths
        run: pwd && ls -la

      - name: Run local devnet
        run: sudo docker compose up -d
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and commit image from container
        run: sudo docker commit -p \ 
            $(sudo docker ps --filter "name=go-ethereumtestlocaldevnet-app-1" -q) stigi/smart-contract-deployment

      - name: Push image to DockerHub
        run: sudo docker push stigi/smart-contract-deployment
        
      - name: Destroy local devnet
        run: sudo docker-compose down
